<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ulanzi IconResizer — Tutorial</title>
<style>
  :root{
    --s1:#9aa6b6; --s2:#ffffff; --s3:#cfd6e2; --acc:#cfd6e2;
    --bg:#0a0c10; --bg2:#0e1116; --card:#12161d; --line:#222a35;
    --tx:#eef2f7; --mut:#7e8a99; --r:14px;
    --mono:'SFMono-Regular',ui-monospace,'Cascadia Code',Consolas,monospace;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;background:var(--bg);color:var(--tx);
    font-family:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.6;-webkit-font-smoothing:antialiased;
    background-image:radial-gradient(900px 500px at 50% -10%,rgba(207,214,226,.10),transparent 60%),radial-gradient(800px 500px at 110% 110%,rgba(154,166,182,.07),transparent 55%);
    background-attachment:fixed;}
  .wrap{max-width:860px;margin:0 auto;padding:30px 20px 60px;}
  .topbar{display:flex;align-items:center;gap:12px;margin-bottom:26px;font-family:var(--mono);font-size:12px;color:var(--mut);border-bottom:1px solid var(--line);padding-bottom:14px;}
  .live{display:inline-flex;align-items:center;gap:7px;color:var(--s3);font-weight:700;letter-spacing:.14em;}
  .live i{width:8px;height:8px;border-radius:50%;background:var(--s3);box-shadow:0 0 10px var(--s3);animation:beat 1.6s ease-in-out infinite;}
  .topbar .path{margin-left:auto;opacity:.65;}
  h1{font-size:clamp(30px,6vw,42px);line-height:1.05;margin:0;font-weight:800;letter-spacing:-.025em;}
  h1 .g{background:linear-gradient(110deg,var(--s1),var(--s2) 50%,var(--s1));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .sub{color:var(--mut);margin:8px 0 0;font-size:15px;}
  .lead{font-size:16px;color:#c6cfda;margin:20px 0 8px;max-width:72ch;}
  .toc{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 6px;}
  .toc a{font-size:12.5px;font-weight:600;color:var(--s3);text-decoration:none;background:#10141a;border:1px solid var(--line);border-radius:9px;padding:7px 12px;transition:all .15s;}
  .toc a:hover{border-color:var(--s3);transform:translateY(-1px);}
  .sec{margin:30px 0;scroll-margin-top:18px;}
  .sec.focus .card{border-color:var(--s3);box-shadow:0 0 0 3px rgba(207,214,226,.12);}
  .kicker{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--s3);font-weight:700;margin-bottom:10px;}
  .kicker::before{content:"// ";opacity:.55;}
  h2{font-size:21px;margin:0 0 4px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:10px;}
  h2 .ic{width:32px;height:32px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;background:#10141a;border:1px solid var(--line);box-shadow:inset 0 0 0 1px rgba(207,214,226,.12);flex:0 0 32px;}
  h2 .ic img{width:20px;height:20px;display:block;}
  .toc a img{width:14px;height:14px;vertical-align:-2px;margin-right:6px;}
  .fdesc{color:var(--mut);font-size:14px;margin:0 0 12px;}
  .card{position:relative;background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;overflow:hidden;transition:border-color .2s, box-shadow .2s;}
  .card::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--s3),transparent 70%);}
  ol.steps{counter-reset:s;list-style:none;margin:0;padding:2px 0 0 6px;}
  ol.steps li{position:relative;padding:5px 0 15px 42px;font-size:14.5px;color:#d4dce5;}
  ol.steps li:not(:last-child)::after{content:"";position:absolute;left:14px;top:30px;bottom:0;width:2px;background:var(--line);}
  ol.steps li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:2px;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#10141a;background:radial-gradient(circle at 35% 30%,var(--s2),var(--s1));box-shadow:0 0 0 4px rgba(207,214,226,.10);}
  ol.steps b{color:#fff;}
  .tips{margin-top:6px;border-top:1px dashed var(--line);padding-top:10px;}
  .tips .tt{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--s3);font-weight:700;}
  .tips ul{list-style:none;margin:6px 0 0;padding:0;}
  .tips li{position:relative;padding:4px 0 4px 20px;color:var(--mut);font-size:13px;}
  .tips li::before{content:"\2726";position:absolute;left:2px;top:4px;color:var(--s3);}
  .credits{margin-top:42px;display:flex;align-items:center;gap:18px;background:linear-gradient(180deg,#10151c,#0b0f14);border:1px solid var(--line);border-radius:18px;padding:22px;}
  @media(max-width:520px){.credits{flex-direction:column;text-align:center;}}
  .avatar{width:78px;height:78px;border-radius:18px;flex:0 0 78px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:26px;color:#10141a;background:linear-gradient(135deg,var(--s1),var(--s2));border:1px solid var(--line);box-shadow:0 6px 18px rgba(0,0,0,.45);}
  .avatar img{width:100%;height:100%;object-fit:cover;display:block;}
  .cby{color:var(--mut);font-size:12px;font-family:var(--mono);}
  .cname2{font-size:18px;font-weight:800;margin:2px 0 12px;}
  .social{display:flex;gap:10px;flex-wrap:wrap;}
  .social a{display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:var(--tx);background:#131822;border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-weight:600;font-size:13px;transition:all .15s;}
  .social a:hover{border-color:var(--s3);color:var(--s2);transform:translateY(-2px);}
  .social svg{width:17px;height:17px;fill:currentColor;}
  .foot{color:#525e6b;font-size:11px;text-align:center;margin-top:22px;font-family:var(--mono);}
  @keyframes rise{to{opacity:1;transform:none;}}
  @keyframes beat{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(.55);opacity:.5;}}
</style>
</head>

<script>
const FN_KEYS = ['resize','search','images','text','animated','ai','batch'];
// official action icons from /resources (the same ones shown in Ulanzi Studio)
const FN_SVGS = { resize:'action-icon.svg', search:'action-search.svg', images:'action-images.svg', text:'action-text.svg', animated:'action-animated.svg', ai:'action-ai.svg', batch:'action-batch.svg' };
const fnImg = (k) => '<img src="../resources/' + FN_SVGS[k] + '" alt="" loading="lazy">';

const TUT = {
en:{ sub:'How to use every tool', lead:'IconResizer is a 7-in-1 icon studio for your Ulanzi Deck: resize images, search icons and photos, create text and animated keys, generate icons with AI and export whole packs. Tap the ? button in any tool to come back here.', tips:'Tips', by:'Developed by', foot:'Ulanzi IconResizer — tutorial',
 fn:{
 resize:{ n:'Icon Resizer', d:'Turn any image into a perfectly framed key icon.', s:['Click <b>Choose image</b> and pick a PNG, JPG or GIF.','Drag to position and use the slider / mouse wheel to zoom — the preview shows exactly what the key will display.','Double-click the preview to fit the whole image.','Click <b>Apply</b> to send the icon to the key.'], t:['High-resolution images stay crisp after the resize.','GIFs keep their animation on the key.'] },
 search:{ n:'Icon Search', d:'Search 200,000+ vector icons and apply them in one click.', s:['Type what you need — <b>any language works</b> (e.g. “foguete”, “苹果”): it is translated to English automatically.','Pick a color with the color picker.','Click <b>Search</b> and then click an icon to load it.','Adjust the framing and click <b>Apply</b>.'], t:['Vector icons stay sharp at any size.','Try synonyms if a term returns few results.'] },
 images:{ n:'Image Search', d:'Find photos online and use them as key icons.', s:['Type a search term in any language.','Click <b>Search</b> and browse the photo grid.','Click a photo — the cropper opens with the original image.','Frame the part you want and click <b>Apply</b>.'], t:['Prefer square crops — keys are square.','The cropper shows the full original so you can pick the angle.'] },
 text:{ n:'Text Button', d:'Create clean text keys: labels, shortcuts, numbers.', s:['Type the text (1–2 short words work best).','Choose font, size, text color and background.','Watch the live preview update in real time.','Click <b>Apply</b> to send it to the key.'], t:['Strong contrast (light text on dark) reads best on the deck.','Use the same style across keys for a uniform look.'] },
 animated:{ n:'Animated Generator', d:'Generate animated GIF icons with themes and effects.', s:['Pick a theme and an animation effect.','Tune colors and speed — the preview plays live.','Click <b>Generate</b> and wait for the GIF.','Click <b>Apply</b> to send it to the key.'], t:['Short loops look smoother on the deck.','Too many animated keys use more deck resources.'] },
 ai:{ n:'AI Generator', d:'Describe the icon you want and let the AI draw it.', s:['Describe the icon in the chat — any language (“a blue rocket, flat style”).','Choose the resolution when asked.','Wait for generation and preview the result.','Click <b>Apply</b>, or refine with another message.'], t:['Mention subject + style + color for better results.','Iterate: each new message refines the idea.'] },
 batch:{ n:'Batch Pack', d:'Build a whole icon pack at once and export it.', s:['Search a theme (any language) — e.g. “social media”.','Click the icons you want to include in the pack.','Pick a common color for visual consistency.','Click <b>Generate pack</b> and import it in Ulanzi Studio.'], t:['One color across the pack = professional look.','Packs save time when setting up a whole page of keys.'] } } },

 animated:{ n:'Gerador Animado', d:'Gere ícones GIF animados com temas e efeitos.', s:['Escolha um tema e um efeito de animação.','Ajuste cores e velocidade — a prévia toca ao vivo.','Clique em <b>Gerar</b> e aguarde o GIF.','Clique em <b>Aplicar</b> para enviar à tecla.'], t:['Loops curtos ficam mais fluidos no deck.','Muitas teclas animadas consomem mais recursos do deck.'] },
 ai:{ n:'Gerador IA', d:'Descreva o ícone que quer e deixe a IA desenhar.', s:['Descreva o ícone no chat — qualquer idioma (“um foguete azul, estilo flat”).','Escolha a resolução quando solicitado.','Aguarde a geração e veja a prévia.','Clique em <b>Aplicar</b>, ou refine com outra mensagem.'], t:['Cite assunto + estilo + cor para resultados melhores.','Itere: cada nova mensagem refina a ideia.'] },

es:{ sub:'Cómo usar cada herramienta', lead:'IconResizer es un estudio de iconos 7-en-1 para tu Ulanzi Deck: redimensiona imágenes, busca iconos y fotos, crea teclas de texto y animadas, genera iconos con IA y exporta packs completos. Toca el botón ? de cualquier herramienta para volver aquí.', tips:'Consejos', by:'Desarrollado por', foot:'Ulanzi IconResizer — tutorial',

 images:{ n:'Buscar Imágenes', d:'Encuentra fotos online y úsalas como icono.', s:['Escribe un término en cualquier idioma.','Haz clic en <b>Buscar</b> y explora la cuadrícula.','Haz clic en una foto — el recorte abre con la original.','Encuadra la parte deseada y pulsa <b>Aplicar</b>.'], t:['Prefiere recortes cuadrados — las teclas son cuadradas.','El recorte muestra la original completa para elegir el ángulo.'] },
 text:{ n:'Botón de Texto', d:'Crea teclas de texto limpias: etiquetas, atajos, números.', s:['Escribe el texto (1–2 palabras cortas).','Elige fuente, tamaño, color y fondo.','Mira la vista previa en tiempo real.','Pulsa <b>Aplicar</b> para enviarlo a la tecla.'], t:['El contraste fuerte se lee mejor en el deck.','Usa el mismo estilo en varias teclas para uniformidad.'] },
 animated:{ n:'Generador Animado', d:'Genera iconos GIF animados con temas y efectos.', s:['Elige un tema y un efecto.','Ajusta colores y velocidad — la vista previa se reproduce en vivo.','Pulsa <b>Generar</b> y espera el GIF.','Pulsa <b>Aplicar</b> para enviarlo a la tecla.'], t:['Los bucles cortos se ven más fluidos.','Muchas teclas animadas consumen más recursos.'] },

fr:{ sub:'Comment utiliser chaque outil', lead:'IconResizer est un studio d’icônes 7-en-1 pour votre Ulanzi Deck : redimensionnez des images, cherchez icônes et photos, créez des touches texte et animées, générez des icônes par IA et exportez des packs. Touchez le bouton ? de n’importe quel outil pour revenir ici.', tips:'Astuces', by:'Développé par', foot:'Ulanzi IconResizer — tutoriel',

 images:{ n:'Recherche d’Images', d:'Trouvez des photos en ligne pour vos touches.', s:['Tapez un terme dans n’importe quelle langue.','Cliquez sur <b>Rechercher</b> et parcourez la grille.','Cliquez sur une photo — le recadrage s’ouvre sur l’originale.','Cadrez la zone voulue et cliquez sur <b>Appliquer</b>.'], t:['Préférez des cadrages carrés.','Le recadrage montre l’originale entière pour choisir l’angle.'] },

 batch:{ n:'Pack par Lot', d:'Créez un pack d’icônes complet et exportez-le.', s:['Cherchez un thème (toute langue).','Cliquez sur les icônes à inclure.','Choisissez une couleur commune.','Cliquez sur <b>Générer le pack</b> puis importez-le dans Ulanzi Studio.'], t:['Une seule couleur = rendu professionnel.','Les packs font gagner du temps pour une page entière.'] } } },

de:{ sub:'So nutzt du jedes Werkzeug', lead:'IconResizer ist ein 7-in-1-Icon-Studio für dein Ulanzi Deck: Bilder anpassen, Icons und Fotos suchen, Text- und Animations-Tasten erstellen, Icons per KI generieren und ganze Packs exportieren. Tippe in jedem Werkzeug auf ?, um hierher zurückzukommen.', tips:'Tipps', by:'Entwickelt von', foot:'Ulanzi IconResizer — Anleitung',
 fn:{
 resize:{ n:'Icon Anpassen', d:'Mache aus jedem Bild ein perfekt gerahmtes Tasten-Icon.', s:['Klicke <b>Bild wählen</b> (PNG, JPG oder GIF).','Ziehe zum Positionieren, zoome per Slider / Mausrad.','Doppelklick auf die Vorschau passt das ganze Bild ein.','Klicke <b>Anwenden</b>, um das Icon zur Taste zu senden.'], t:['Hochauflösende Bilder bleiben scharf.','GIFs behalten ihre Animation auf der Taste.'] },
 search:{ n:'Icon-Suche', d:'Durchsuche 200.000+ Vektor-Icons, ein Klick genügt.', s:['Tippe deinen Begriff — <b>jede Sprache</b>: wird automatisch ins Englische übersetzt.','Wähle die Farbe.','Klicke <b>Suchen</b> und dann auf ein Icon.','Rahmen anpassen und <b>Anwenden</b> klicken.'], t:['Vektor-Icons bleiben in jeder Größe scharf.','Bei wenigen Treffern Synonyme probieren.'] },
 images:{ n:'Bild-Suche', d:'Finde Fotos online und nutze sie als Tasten-Icon.', s:['Suchbegriff in beliebiger Sprache eingeben.','<b>Suchen</b> klicken und das Raster durchstöbern.','Foto anklicken — der Zuschnitt öffnet das Original.','Gewünschten Ausschnitt rahmen und <b>Anwenden</b>.'], t:['Quadratische Ausschnitte bevorzugen.','Der Zuschnitt zeigt das ganze Original.'] },

 animated:{ n:'Animations-Generator', d:'Erzeuge animierte GIF-Icons mit Themen und Effekten.', s:['Thema und Effekt wählen.','Farben und Tempo einstellen — Vorschau läuft live.','<b>Generieren</b> klicken und auf das GIF warten.','<b>Anwenden</b> klicken.'], t:['Kurze Loops wirken flüssiger.','Viele animierte Tasten brauchen mehr Ressourcen.'] },
 ai:{ n:'KI-Generator', d:'Beschreibe dein Icon, die KI zeichnet es.', s:['Icon im Chat beschreiben — jede Sprache.','Auflösung wählen, wenn gefragt.','Generierung abwarten, Vorschau prüfen.','<b>Anwenden</b> klicken oder mit einer neuen Nachricht verfeinern.'], t:['Motiv + Stil + Farbe nennen.','Iterieren: jede Nachricht verfeinert die Idee.'] },
 batch:{ n:'Batch-Pack', d:'Baue ein ganzes Icon-Pack und exportiere es.', s:['Thema suchen (jede Sprache).','Icons fürs Pack anklicken.','Gemeinsame Farbe wählen.','<b>Pack generieren</b> und in Ulanzi Studio importieren.'], t:['Eine Farbe = professioneller Look.','Packs sparen Zeit für ganze Seiten.'] } } },

function detectLang(){
  const params = new URLSearchParams(location.search);
  const hashP = new URLSearchParams((location.hash||'').replace(/^#/,''));
  let l = params.get('lang') || hashP.get('lang') || navigator.language || 'en';
  l = String(l).replace('-','_').toLowerCase();
  if (l.startsWith('zh')) return (l.includes('tw') || l.includes('hk') || l.includes('hant')) ? 'zh_TW' : 'zh';
  const s = l.split('_')[0];
  return TUT[s] ? s : 'en';
}
function fnAnchor(){
  const params = new URLSearchParams(location.search);
  const hashP = new URLSearchParams((location.hash||'').replace(/^#/,''));
  const f = params.get('fn') || hashP.get('fn') || '';
  return FN_KEYS.includes(f) ? f : '';
}

const lang = detectLang();
const d = TUT[lang] || TUT.en;
document.documentElement.lang = lang;
document.getElementById('sub').textContent = d.sub;
document.getElementById('lead').textContent = d.lead;
document.getElementById('c_by').textContent = d.by;
document.getElementById('foot').textContent = d.foot;
const PF = { pt:'Portfólio', es:'Portafolio', fr:'Portfolio', de:'Portfolio', ja:'ポートフォリオ', ko:'포트폴리오', zh:'作品集', zh_TW:'作品集', en:'Portfolio' };
document.getElementById('c_site').textContent = PF[lang] || 'Portfolio';

const toc = document.getElementById('toc');
const secWrap = document.getElementById('sections');
FN_KEYS.forEach(k => {
  const f = d.fn[k];
  const a = document.createElement('a');
  a.href = '#' + k; a.innerHTML = fnImg(k) + f.n;
  toc.appendChild(a);
  const sec = document.createElement('div');
  sec.className = 'sec'; sec.id = k;
  sec.innerHTML =
    '<span class="kicker">' + k + '</span>' +
    '<h2><span class="ic">' + fnImg(k) + '</span>' + f.n + '</h2>' +
    '<p class="fdesc">' + f.d + '</p>' +
    '<div class="card"><ol class="steps">' + f.s.map(x => '<li>' + x + '</li>').join('') + '</ol>' +
    '<div class="tips"><span class="tt">' + d.tips + '</span><ul>' + f.t.map(x => '<li>' + x + '</li>').join('') + '</ul></div></div>';
  secWrap.appendChild(sec);
});

const target = fnAnchor();
if (target) {
  const el = document.getElementById(target);
  if (el) { el.classList.add('focus'); setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'start' }), 80); }
}
</script>
</body>
