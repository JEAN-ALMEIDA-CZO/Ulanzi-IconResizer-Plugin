<html lang="en">

    <!-- Import Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Bebas+Neue&family=Caveat:wght@700&family=Inter:wght@400;600;800&family=Lato:wght@700&family=Montserrat:wght@700&family=Oswald:wght@700&family=Pacifico&family=Play&family=Poppins:wght@600&family=Raleway:wght@700&family=Righteous&family=Roboto:wght@700&family=Ubuntu:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #cfd6e2;
            --accent-hover: #aeb7c4;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --success: #10b981;
            --glow: rgba(200, 210, 224, 0.4);
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            width: 100%;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 440px;
            padding: 12px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .preview-section {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 10px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
        }
        .preview-canvas-container {
            width: 100%;
            height: 96px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border-radius: 6px;
            overflow-x: auto;
            overflow-y: hidden;
            border: 1px solid var(--border);
            scrollbar-width: thin;
        }
        canvas {
            height: 78px;
            margin: 0 6px;
            object-fit: contain;
        }
        .actions-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
            justify-content: center;
        }
        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .control-group.full {
            grid-column: span 2;
        }
        label {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
        }
        input[type="text"], select, input[type="number"] {
            background: #0f172a;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 6px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-family: inherit;
            width: 100%;
            box-sizing: border-box;
        }
        input[type="text"]:focus, select:focus, input[type="number"]:focus {
            outline: none;
            border-color: var(--accent);
        }
        .color-row {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        input[type="color"] {
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 0;
            width: 24px;
            height: 24px;
            cursor: pointer;
        }
        .start-btn {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 8px 16px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.2s;
            text-align: center;
            white-space: nowrap;
            width: 100%;
            box-sizing: border-box;
        }
        .start-btn:hover { background: var(--accent-hover); }
        .start-btn.outline {
            background: transparent;
            border: 1px dashed var(--border);
            color: var(--text-muted);
        }
        .start-btn.outline:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        .presets-row {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 4px 2px 6px 2px;
            margin-top: 4px;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
        }
        .preset-btn {
            width: 24px;
            height: 24px;
            border-radius: 4px;
            border: 1px solid var(--border);
            cursor: pointer;
            flex-shrink: 0;
            transition: transform 0.2s;
        }
        .preset-btn:hover {
            transform: scale(1.1);
            border-color: var(--accent);
        }
        .item-row {
            display: flex;
            gap: 6px;
            margin-bottom: 6px;
            align-items: center;
            padding: 4px;
            border: 1px solid transparent;
            transition: all 0.2s;
        }
        .item-row.active-row {
            background: rgba(200, 210, 224, 0.15);
            border-color: var(--accent);
            border-radius: 6px;
        }
        .app-panel {
            border: 2px dashed var(--border);
            border-radius: 8px;
            width: 100%;
            height: 150px;
            background: rgba(30, 41, 59, 0.4);
            display: flex;
            flex-direction: column;
            padding: 8px;
            box-sizing: border-box;
        }
        .item-row input.emoji-input {
            width: 40px;
            text-align: center;
            font-size: 1.1rem;
            padding: 4px 0;
        }
        .item-row button.del-btn {
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        .grid-3x3 {
            display: grid;
            grid-template-columns: repeat(3, 22px);
            grid-template-rows: repeat(3, 22px);
            gap: 2px;
            background: #0f172a;
            padding: 4px;
            border-radius: 6px;
            border: 1px solid var(--border);
            width: fit-content;
        }
        .pos-btn {
            background: transparent;
            border: 1px solid transparent;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            width: 22px !important;
            height: 22px !important;
            min-width: 0 !important;
            min-height: 0 !important;
            padding: 0 !important;
            margin: 0 !important;
            box-sizing: border-box !important;
        }
        .pos-btn:hover {
            background: rgba(255,255,255,0.1);
        }
        .pos-btn.active {
            background: var(--accent);
            border-color: var(--accent);
        }
    
        /* ── silver shimmer theme + accessibility helpers (injected) ── */
        :root { --accent-ink:#0f172a; --silver-1:#9aa6b6; --silver-2:#ffffff; }
        @keyframes silverShine { 0%{background-position:220% 0} 100%{background-position:-220% 0} }
        .start-btn, button.start-btn {
            background-image: linear-gradient(110deg, var(--silver-1) 0%, var(--silver-2) 45%, #cfd6e2 55%, var(--silver-1) 100%);
            background-size: 220% 100%;
            color: var(--accent-ink) !important;
            border: none;
            animation: none; /* shimmer only while working */
            box-shadow: 0 2px 10px rgba(207,214,226,0.18);
        }
        .start-btn.outline { background-image:none; background:transparent; color:var(--text-muted) !important; animation:none; box-shadow:none; }
        .start-btn.working, button.start-btn.working { animation: silverShine 3.5s linear infinite; }
        .start-btn:hover { filter: brightness(1.06); }
        .ui-hint {
            display:inline-flex; align-items:center; gap:5px;
            font-size:0.62rem; line-height:1.2; color:var(--text-muted);
            background:rgba(255,255,255,0.05); border:1px solid var(--border);
            border-radius:10px; padding:2px 8px; white-space:nowrap; user-select:none;
        }
        .ui-hint svg { width:11px; height:11px; opacity:.85; flex-shrink:0; }
        .ui-hint b { color:var(--text-main); font-weight:600; }

    
        /*range-fix*/
        input[type="range"]{-webkit-appearance:none;appearance:none;height:4px;background:var(--border);border-radius:3px;outline:none;}
        input[type="range"]::-webkit-slider-runnable-track{height:4px;background:var(--border);border-radius:3px;}
        input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:13px;height:13px;margin-top:-4.5px;border-radius:50%;background:var(--accent);box-shadow:0 0 6px var(--glow);border:none;cursor:pointer;}
        input[type="range"]::-webkit-slider-thumb:hover{background:#ffffff;}
        input[type="range"]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--accent);border:none;cursor:pointer;}
        input[type="range"]::-moz-range-track{height:4px;background:var(--border);border-radius:3px;}
    
        /*ai-thinking*/
        @keyframes aiThink { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
        @keyframes aiDots { 0%{content:''} 20%{content:'.'} 40%{content:'..'} 60%,100%{content:'...'} }
        .ai-thinking{
            display:inline-block; font-weight:600;
            background-image:linear-gradient(90deg,#8b95a7 0%,#ffffff 25%,#cfd6e2 50%,#ffffff 75%,#8b95a7 100%);
            background-size:200% 100%;
            -webkit-background-clip:text; background-clip:text;
            -webkit-text-fill-color:transparent; color:transparent;
            animation:aiThink 1.8s linear infinite;
        }
        .ai-thinking-dots::after{ content:''; display:inline-block; width:1.1em; text-align:left; animation:aiDots 1.4s steps(1,end) infinite; color:#cfd6e2; font-weight:600; }
    </style>
</head>

    <script src="../ws-port.js"></script>
    <script>
        const AVAILABLE_LANGS = ['en', 'pt', 'es', 'fr', 'de', 'zh', 'ja', 'ko', 'zh_TW'];
        let currentLocale = {};
        let actionContext = null;

        let currentIconEditIndex = 0;
        let items = [
            { text: 'MIC', emoji: '🎙️', iconType: 'emoji' }
        ];

        function resolveLanguageCode(rawLang) {
            if (!rawLang) return 'en';
            rawLang = rawLang.replace('_', '-');
            const lower = rawLang.toLowerCase();
            
            if (lower === 'zh-tw' || lower === 'zh-hant' || lower === 'zh-hk') return 'zh_TW';
            if (lower.startsWith('zh')) return 'zh';
            
            const base = rawLang.split('-')[0].toLowerCase();
            return AVAILABLE_LANGS.includes(base) ? base : 'en';
        }

        function detectLanguage() {
            const params = new URLSearchParams(window.location.search);
            const sdkLang = params.get('language');
            if (sdkLang) return resolveLanguageCode(sdkLang);
            const browserLang = navigator.languages && navigator.languages.length ? navigator.languages[0] : (navigator.language || navigator.userLanguage);
            return resolveLanguageCode(browserLang);
        }

        async function loadAndApplyLocalization() {
            const langCode = detectLanguage();
            
            try {
                const resp = await fetch(`../${langCode}.json`);
                if (resp.ok) {
                    const json = await resp.json();
                    currentLocale = json.Localization || {};
                }
            } catch (e) {
                // fallback
            }
            
            document.querySelectorAll('[data-localize]').forEach(el => {
                const key = el.dataset.localize;
                if (currentLocale[key]) el.textContent = currentLocale[key];
            });
            
            document.querySelectorAll('[data-localize-placeholder]').forEach(el => {
                const key = el.dataset.localizePlaceholder;
                if (currentLocale[key]) el.placeholder = currentLocale[key];
            });
            
            // Translate the default item if still the factory default (single MIC button)
            if (items.length === 1 && items[0].text === 'MIC') {
                if (langCode.startsWith('pt')) items[0].text = 'MICROFONE';
                else if (langCode.startsWith('es')) items[0].text = 'MICRÓFONO';
                else if (langCode.startsWith('fr')) items[0].text = 'MICRO';
                else if (langCode.startsWith('de')) items[0].text = 'MIKROFON';
                else if (langCode.startsWith('zh')) items[0].text = '麦克风';
                else if (langCode.startsWith('ja')) items[0].text = 'マイク';
                else if (langCode.startsWith('ko')) items[0].text = '마이크';
                renderItemsList();
                renderPreview();
            }
        }

        function applyPreset(bg1, bg2, t1, t2) {
            document.getElementById('bg-color1').value = bg1;
            document.getElementById('bg-color2').value = bg2;
            document.getElementById('text-color1').value = t1;
            document.getElementById('text-color2').value = t2;
            renderPreview();
        }

        function renderItemsList() {
            const container = document.getElementById('items-container');
            container.innerHTML = '';
            items.forEach((item, idx) => {
                const div = document.createElement('div');
                div.className = 'item-row';
                if (idx === currentIconEditIndex) div.classList.add('active-row');
                
                const iconBox = document.createElement('button');
                iconBox.style.cssText = "width:40px; height:32px; background:#0f172a; border:1px solid var(--border); border-radius:4px; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; padding:0;";
                iconBox.title = "Clique para trocar o ícone";
                iconBox.onclick = () => {
                    currentIconEditIndex = idx;
                    updateActiveRow();
                };

                if (item.iconType === 'svg' && item.iconSrc) {
                    const img = document.createElement('img');
                    img.src = item.iconSrc;
                    img.style.cssText = "width:20px; height:20px; object-fit:contain;";
                    iconBox.appendChild(img);
                } else {
                    const span = document.createElement('span');
                    span.style.cssText = "font-size:1.1rem;";
                    span.textContent = item.emoji;
                    iconBox.appendChild(span);
                }
                
                const inpText = document.createElement('input');
                inpText.type = 'text';
                inpText.value = item.text;
                inpText.placeholder = currentLocale['bp_name'] || 'Name';
                inpText.onfocus = () => {
                    currentIconEditIndex = idx;
                    updateActiveRow();
                };
                inpText.oninput = (e) => { items[idx].text = e.target.value; renderPreview(); };
                
                const btnDel = document.createElement('button');
                btnDel.className = 'del-btn';
                btnDel.innerHTML = '×';
                btnDel.onclick = () => { 
                    if(items.length > 1) {
                        items.splice(idx, 1); 
                        renderItemsList(); 
                        renderPreview(); 
                    }
                };
                
                div.appendChild(iconBox);
                div.appendChild(inpText);
                div.appendChild(btnDel);
                container.appendChild(div);
            });
        }

        function updateActiveRow() {
            const rows = document.querySelectorAll('.item-row');
            rows.forEach((row, idx) => {
                if (idx === currentIconEditIndex) {
                    row.classList.add('active-row');
                } else {
                    row.classList.remove('active-row');
                }
            });
        }

        function addItem() {
            items.push({ text: currentLocale['bp_item_new'] || 'NEW', emoji: '✨' });
            renderItemsList();
            renderPreview();
        }

        function drawButton(ctx, item, x, y, size) {
            const bg1 = document.getElementById('bg-color1').value;
            const bg2 = document.getElementById('bg-color2').value;
            const t1 = document.getElementById('text-color1').value;
            const t2 = document.getElementById('text-color2').value;
            
            const borderRadius = parseInt(document.getElementById('border-radius').value);
            const fontFamily = document.getElementById('font-family').value;
            
            const hasShadow = document.getElementById('shadow-toggle').checked;
            const shadowColor = document.getElementById('shadow-color').value;
            const shadowBlur = document.getElementById('shadow-blur').value;

            const hasBorder = document.getElementById('border-toggle').checked;
            const borderColor = document.getElementById('border-color').value;
            const borderWidth = hasBorder ? parseInt(document.getElementById('border-width').value) : 0;

            // Background
            const bgGradient = ctx.createLinearGradient(x, y, x+size, y+size);
            bgGradient.addColorStop(0, bg1);
            bgGradient.addColorStop(1, bg2);
            ctx.fillStyle = bgGradient;
            
            ctx.beginPath();
            ctx.roundRect(x + borderWidth/2, y + borderWidth/2, size - borderWidth, size - borderWidth, borderRadius);
            ctx.fill();

            // Border
            if (hasBorder && borderWidth > 0) {
                ctx.strokeStyle = borderColor;
                ctx.lineWidth = borderWidth;
                ctx.stroke();
            }

            // Shadow settings for elements inside
            if (hasShadow) {
                ctx.shadowColor = shadowColor;
                ctx.shadowBlur = shadowBlur;
                ctx.shadowOffsetX = 2;
                ctx.shadowOffsetY = 2;
            } else {
                ctx.shadowColor = 'transparent';
                ctx.shadowBlur = 0;
            }

            const hasText = item.text && item.text.trim().length > 0;
            const hasIcon = (item.iconType === 'svg' && item.imgObj) || item.emoji;
            
            let activePos = 'bc';
            document.querySelectorAll('.pos-btn').forEach(b => {
                if (b.classList.contains('active')) activePos = b.dataset.pos;
            });

            let iconOffsetX = 0;
            let iconOffsetY = 0;
            
            if (hasText && hasIcon) {
                if (activePos.includes('t')) iconOffsetY = size * 0.12;
                else if (activePos.includes('b')) iconOffsetY = -size * 0.12;
                if (activePos.includes('l')) iconOffsetX = size * 0.12;
                else if (activePos.includes('r')) iconOffsetX = -size * 0.12;
            }

            // user size controls (icon + text), default 1 = current look
            const iconScaleEl = document.getElementById('icon-scale');
            const textScaleEl = document.getElementById('text-scale');
            const iconScale = iconScaleEl ? (parseFloat(iconScaleEl.value) || 1) : 1;
            const textScale = textScaleEl ? (parseFloat(textScaleEl.value) || 1) : 1;

            const emojiSize = (hasText ? size * 0.34 : size * 0.42) * iconScale;
            const svgSize = (hasText ? size * 0.40 : size * 0.48) * iconScale;

            // Draw Emoji OR SVG
            if (item.iconType === 'svg' && item.imgObj) {
                const tempC = document.createElement('canvas');
                tempC.width = size; tempC.height = size;
                const tCtx = tempC.getContext('2d');
                
                const ix = size/2 + iconOffsetX - svgSize/2;
                const iy = size/2 + iconOffsetY - svgSize/2;
                
                tCtx.drawImage(item.imgObj, ix, iy, svgSize, svgSize);
                
                tCtx.globalCompositeOperation = 'source-in';
                const textGradient = tCtx.createLinearGradient(0, 0, 0, size);
                textGradient.addColorStop(0, t1);
                textGradient.addColorStop(1, t2);
                tCtx.fillStyle = textGradient;
                tCtx.fillRect(0, 0, size, size);
                
                ctx.drawImage(tempC, x, y, size, size);
            } else if (item.emoji) {
                const textGradient = ctx.createLinearGradient(x, y, x, y+size);
                textGradient.addColorStop(0, t1);
                textGradient.addColorStop(1, t2);
                ctx.fillStyle = textGradient;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.font = `${emojiSize}px "${fontFamily}", sans-serif`;
                ctx.fillText(item.emoji, x + size/2 + iconOffsetX, y + size/2 + iconOffsetY);
            }

            // Draw Text
            if (hasText) {
                const textGradient2 = ctx.createLinearGradient(x, y, x, y+size);
                textGradient2.addColorStop(0, t1);
                textGradient2.addColorStop(1, t2);
                ctx.fillStyle = textGradient2;
                
                let tx = x + size/2;
                let ty = y + size/2;
                
                if (activePos.includes('l')) { ctx.textAlign = 'left'; tx = x + size * 0.10; }
                else if (activePos.includes('r')) { ctx.textAlign = 'right'; tx = x + size * 0.90; }
                else { ctx.textAlign = 'center'; tx = x + size/2; }
                
                if (activePos.includes('t')) { ctx.textBaseline = 'top'; ty = y + size * 0.10; }
                else if (activePos.includes('b')) { ctx.textBaseline = 'bottom'; ty = y + size * 0.90; }
                else { ctx.textBaseline = 'middle'; ty = y + size/2; }
                
                if (activePos === 'bc' && hasIcon) {
                    ctx.textBaseline = 'middle';
                    ty = y + size/2 + size * 0.28;
                }
                
                ctx.font = `600 ${(hasIcon ? size * 0.16 : size * 0.20) * textScale}px "${fontFamily}", sans-serif`;
                ctx.fillText(item.text, tx, ty);
            }
            
            // Reset shadows
            ctx.shadowColor = 'transparent';
        }

        function renderPreview() {
            const canvas = document.getElementById('preview-canvas');
            const ctx = canvas.getContext('2d');
            
            const size = 144;
            const gap = 0; // joined as a single strip ("uma coisa só")
            canvas.width = (items.length * size) + Math.max(0, (items.length - 1) * gap);
            canvas.height = size;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            items.forEach((item, idx) => {
                drawButton(ctx, item, idx * (size + gap), 0, size);
            });
        }

        // Fonts load async (Google Fonts). Drawing to canvas before the face is ready
        // silently falls back — which looked like "the font doesn't update". Load the
        // chosen face first, THEN redraw, so the preview reflects the font in real time.
        function onFontChange() {
            const f = document.getElementById('font-family').value;
            if (document.fonts && document.fonts.load) {
                Promise.all([
                    document.fonts.load(`600 40px "${f}"`),
                    document.fonts.load(`40px "${f}"`)
                ]).then(renderPreview).catch(renderPreview);
            } else {
                renderPreview();
            }
        }

        // --- ICON PANEL LOGIC ---
        function applyEmojiFromPanel() {
            const val = document.getElementById('icon-emoji-input').value.trim();
            if (!val || currentIconEditIndex < 0) return;
            items[currentIconEditIndex].iconType = 'emoji';
            items[currentIconEditIndex].emoji = val;
            items[currentIconEditIndex].imgObj = null;
            items[currentIconEditIndex].iconSrc = null;
            renderItemsList();
            renderPreview();
        }

        // One gtx call for a given source language. Returns English output plus
        // detected source language + confidence (meaningful only when sl='auto').
        async function gtxTranslate(text, sl) {
            const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=en&dt=t&q=${encodeURIComponent(text)}`;
            const r = await fetch(url);
            const j = await r.json();
            return {
                out: (j[0] || []).map(s => s[0]).join('').trim(),
                det: j[2],
                conf: j[6]
            };
        }

        // Translate ANY language → English (Iconify only indexes English keywords),
        // independent of the UI language. gtx auto-detect is unreliable on short
        // single words (e.g. "bola" → Slovak), so: (1) trust auto only when confident;
        // (2) otherwise probe a priority list of languages and take the first real
        // translation; (3) keep genuine English as-is.
        
        // Non-Google fallback — translate.googleapis.com is blocked in some regions
        // (e.g. mainland China). MyMemory is reachable there and needs no API key.
        async function myMemoryToEn(text, sl) {
            const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${encodeURIComponent(sl)}|en`;
            const r = await fetch(url);
            const j = await r.json();
            const out = ((j.responseData && j.responseData.translatedText) || '').trim();
            // accept only when it actually produced non-CJK/Hangul output
            return out && !/[\u3000-\u9fff\uac00-\ud7af]/.test(out) ? out : '';
        }
        // guess the source language from the script when online detection is unavailable
        function guessSourceLang(text) {
            if (/[\u4e00-\u9fff]/.test(text)) return 'zh-CN';
            if (/[\u3040-\u30ff]/.test(text)) return 'ja';
            if (/[\uac00-\ud7af]/.test(text)) return 'ko';
            if (/[\u0400-\u04ff]/.test(text)) return 'ru';
            return null;
        }
        async function fallbackTranslate(text) {
            try {
                const lc = text.toLowerCase();
                const ui = (typeof currentLangCode !== 'undefined' && currentLangCode)
                    ? (({ zh: 'zh-CN', zh_TW: 'zh-TW' })[currentLangCode] || currentLangCode) : null;
                const order = [];
                const push = l => { if (l && l !== 'en' && !order.includes(l)) order.push(l); };
                push(guessSourceLang(text)); push(ui);
                ['zh-CN', 'pt', 'es', 'fr', 'de'].forEach(push);
                for (const sl of order.slice(0, 4)) {
                    const out = await myMemoryToEn(text, sl);
                    if (out && out.toLowerCase() !== lc) return out;
                }
            } catch (e) { /* offline → keep original */ }
            return text;
        }

        async function translateToEn(text) {
            try {
                const lc = text.toLowerCase();
                const a = await gtxTranslate(text, 'auto');
                if (a.det === 'en' && a.conf >= 0.8) return text;
                if (a.det && a.det !== 'en' && a.conf >= 0.7 && a.out && a.out.toLowerCase() !== lc) {
                    return a.out;
                }
                let uiSl = 'en';
                if (typeof Utils !== 'undefined' && Utils.getLanguage) {
                    const raw = (Utils.getLanguage() || '').toLowerCase();
                    uiSl = raw.startsWith('zh')
                        ? ((raw.includes('tw') || raw.includes('hant')) ? 'zh-TW' : 'zh-CN')
                        : raw.substring(0, 2);
                }
                const order = [];
                const push = l => { if (l && l !== 'en' && !order.includes(l)) order.push(l); };
                push(uiSl);
                ['pt', 'es', 'fr', 'de', 'it', 'ru', 'ja', 'ko', 'zh-CN'].forEach(push);
                for (const sl of order) {
                    const r = await gtxTranslate(text, sl);
                    if (r.out && r.out.toLowerCase() !== lc) return r.out;
                }
                return a.out || text;
            } catch (e) {
                return await fallbackTranslate(text);
            }
        }

        async function searchIconify() {
            const bpl = {
                'pt': { search: "Buscando", notFound: "Nenhum ícone encontrado.", err: "Erro na busca." },
                'es': { search: "Buscando", notFound: "No se encontró ningún icono.", err: "Error en la búsqueda." },
                'en': { search: "Searching", notFound: "No icon found.", err: "Search error." }
            };
            let curLang = 'en';
            if (typeof Utils !== 'undefined' && Utils.getLanguage) {
                const lng = Utils.getLanguage().substring(0, 2);
                if (lng === 'pt' || lng === 'es') curLang = lng;
            }
            
            const query = document.getElementById('icon-search-input').value.trim();
            if (!query) return;
            const grid = document.getElementById('icon-grid');
            grid.innerHTML = `<div style="font-size:0.7rem; grid-column:1/-1; text-align:center; margin-top:10px;"><span class="ai-thinking">${bpl[curLang].search}</span><span class="ai-thinking-dots"></span></div>`;

            // Always translate the query to English (any language) — Iconify only
            // indexes English keywords. English in → English out.
            let searchTerm = (await translateToEn(query)).toLowerCase() || query;

            try {
                const response = await fetch(`https://api.iconify.design/search?query=${encodeURIComponent(searchTerm)}&limit=36`);
                const data = await response.json();
                grid.innerHTML = '';
                if(!data.icons || data.icons.length === 0) {
                    grid.innerHTML = `<div style="color:var(--accent); font-size:0.7rem; grid-column:1/-1; text-align:center; margin-top:10px;">${bpl[curLang].notFound}</div>`;
                    return;
                }
                data.icons.forEach(iconName => {
                    const [prefix, name] = iconName.split(':');
                    const svgUrl = `https://api.iconify.design/${prefix}/${name}.svg?color=%23ffffff`;
                    
                    const img = document.createElement('img');
                    img.src = svgUrl;
                    img.crossOrigin = 'anonymous';
                    img.style.width = '24px';
                    img.style.height = '24px';
                    
                    const wrapper = document.createElement('div');
                    wrapper.className = 'icon-grid-item';
                    wrapper.style.cssText = "width:32px; height:32px; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,0.05); border-radius:4px; cursor:pointer; transition:0.2s; border:1px solid transparent;";
                    wrapper.onmouseover = () => { if(!wrapper.classList.contains('selected')) wrapper.style.borderColor = 'var(--accent)'; };
                    wrapper.onmouseout = () => { if(!wrapper.classList.contains('selected')) wrapper.style.borderColor = 'transparent'; };
                    wrapper.onclick = () => {
                        const allItems = grid.querySelectorAll('.icon-grid-item');
                        allItems.forEach(i => {
                            i.classList.remove('selected');
                            i.style.borderColor = 'transparent';
                        });
                        wrapper.classList.add('selected');
                        wrapper.style.borderColor = 'var(--accent)';
                        selectIconFromPanel(svgUrl);
                    };
                    
                    wrapper.appendChild(img);
                    grid.appendChild(wrapper);
                });
            } catch(e) {
                grid.innerHTML = `<div style="color:#ef4444; font-size:0.7rem;">${bpl[curLang].err}</div>`;
            }
        }

        async function selectIconFromPanel(url) {
            if (currentIconEditIndex < 0) return;
            
            try {
                const response = await fetch(url);
                let svgText = await response.text();
                
                // Força dimensões fixas no SVG removendo atributos antigos e injetando width/height explicitamente
                svgText = svgText.replace(/<svg([^>]+)>/, function(match, attributes) {
                    let cleanAttr = attributes.replace(/\s(width|height)="[^"]+"/g, '');
                    return `<svg${cleanAttr} width="256" height="256">`;
                });
                
                // Converte para Base64 (Data URI) para evitar falhas de Blob no Chromium do Stream Deck
                const b64 = btoa(unescape(encodeURIComponent(svgText)));
                const dataUrl = 'data:image/svg+xml;base64,' + b64;

                const imgObj = new Image();
                imgObj.onload = () => {
                    items[currentIconEditIndex].iconType = 'svg';
                    items[currentIconEditIndex].iconSrc = dataUrl;
                    items[currentIconEditIndex].imgObj = imgObj;
                    items[currentIconEditIndex].emoji = ''; 
                    renderItemsList();
                    renderPreview();
                };
                imgObj.src = dataUrl;
            } catch (e) {
                console.error("Failed to load SVG: ", e);
            }
        }
        // ------------------------

        async function generatePack() {
            const btn = document.getElementById('generate-btn');
            btn.disabled = true;
            btn.textContent = currentLocale['text_btn_processing'] || 'Gerando...';
            
            const expCanvas = document.getElementById('export-canvas');
            const expCtx = expCanvas.getContext('2d');
            const size = 144;

            try {
                for (let i = 0; i < items.length; i++) {
                    const item = items[i];
                    expCtx.clearRect(0, 0, size, size);
                    drawButton(expCtx, item, 0, 0, size);
                    
                    const blob = await new Promise(resolve => expCanvas.toBlob(resolve, 'image/png'));
                    const b64Full = await blobToBase64(blob);
                    const b64 = b64Full.split(',')[1];
                    
                    const uniqueId = Date.now().toString().slice(-5);
                    const safeName = item.text.replace(/[^a-z0-9]/gi, '_') || `icon_${i}`;
                    const filename = `pack_${uniqueId}_${safeName}.png`;
                    
                    await sendToServer(b64, filename);
                }
                
                showSuccessOnDeck();
                btn.textContent = currentLocale['bp_success'] || 'Pacote salvo!';
            } catch (err) {
                console.error(err);
                btn.textContent = currentLocale['text_btn_error'] || 'Erro!';
            } finally {
                setTimeout(() => {
                    btn.disabled = false;
                    btn.textContent = currentLocale['bp_generate'] || 'Gerar Pacote';
                }, 3000);
            }
        }

        function blobToBase64(blob) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result);
                reader.readAsDataURL(blob);
            });
        }

        function sendToServer(b64, filename) {
            return new Promise((resolve) => {
                const payload = { action: 'saveIcon', base64: b64, filename, folder: 'IconResizerPack' };
                const port = window.__port || 19871;
                const xhr = new XMLHttpRequest();
                xhr.open('POST', `http://127.0.0.1:${port}/save`, true);
                xhr.setRequestHeader('Content-Type', 'application/json');
                xhr.onload = () => resolve(true);
                xhr.onerror = () => {
                    if (typeof $UD !== 'undefined' && $UD.sendToPlugin) $UD.sendToPlugin(payload);
                    resolve(true);
                };
                xhr.send(JSON.stringify(payload));
            });
        }

        function showSuccessOnDeck() {
            if (typeof $UD === 'undefined' || !actionContext) return;
            const checkB64 = "data:image/svg+xml;base64," + btoa('<svg xmlns="http://www.w3.org/2000/svg" width="196" height="196" viewBox="0 0 196 196"><rect width="196" height="196" fill="#1E293B"/><circle cx="98" cy="98" r="60" fill="#10B981"/><path d="M70 100l20 20 40-40" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></svg>');
            try {
                $UD.setBaseDataIcon(actionContext, checkB64);
                setTimeout(() => {
                    if (typeof $UD !== 'undefined' && actionContext) {
                        $UD.setPathIcon(actionContext, "resources/action-batch.png");
                    }
                }, 3000);
            } catch (e) {
                console.warn(e);
            }
        }

        // Init
        loadAndApplyLocalization().then(() => {

            renderItemsList();
            document.fonts.ready.then(() => renderPreview());
            
            const posBtns = document.querySelectorAll('.pos-btn');
            posBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    posBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    renderPreview();
                });
            });
        });

        if (typeof $UD !== 'undefined') {
            $UD.connect('com.ulanzi.ulanzistudio.iconresizer.batchpack');
            $UD.onAdd((m) => { actionContext = m.context; });
            $UD.onParamFromApp((m) => { actionContext = m.context; });
        }
    </script>

    <script>
        (function () {
            // Run the silver shimmer only while a task is actually working — saves
            // CPU/GPU when the panel sits idle (requested by the Ulanzi review).
            ['searchIconify', 'searchImages', 'sendPrompt', 'generatePack'].forEach(function (n) {
                var f = window[n];
                if (typeof f !== 'function') return;
                window[n] = async function () {
                    var btns = document.querySelectorAll('.start-btn');
                    btns.forEach(function (b) { b.classList.add('working'); });
                    try { return await f.apply(this, arguments); }
                    finally { btns.forEach(function (b) { b.classList.remove('working'); }); }
                };
            });
        })();
    </script>
