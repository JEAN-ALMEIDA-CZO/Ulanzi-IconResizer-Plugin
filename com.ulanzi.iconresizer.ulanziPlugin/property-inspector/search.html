<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Ulanzi D200H IconResizer</title>
    <link rel="stylesheet" href="../libs/css/uspi.css">
    <script src="../libs/js/gifsicle.min.js"
        onerror="alert('Fatal: Failed to load libs/js/gifsicle.min.js')"></script>
    <script src="../libs/js/constants.js"></script>
    <script src="../libs/js/eventEmitter.js"></script>
    <script src="../libs/js/timers.js"></script>
    <script src="../libs/js/utils.js"></script>
    <script src="../libs/js/ulanziApi.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #cfd6e2;
            --accent-hover: #aeb7c4;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --success: #10b981;
            --glow: rgba(200, 210, 224, 0.4);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 460px;
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            padding: 4px;
        }

        .app-panel {
            border: 2px dashed var(--border);
            border-radius: 12px;
            width: 100%;
            height: 142px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.4), rgba(15, 23, 42, 0.4));
            box-shadow: none;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .app-panel:hover,
        .app-panel.active {
            border-color: var(--accent);
            background: linear-gradient(145deg, rgba(200, 210, 224, 0.05), rgba(30, 41, 59, 0.6));
            box-shadow: 0 0 15px var(--glow);
        }

        .section {
            display: none;
            width: 90%;
            flex-direction: column;
            align-items: center;
            text-align: center;
            animation: fadeIn 0.3s ease;
        }

        .section.visible {
            display: flex;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .section-drop {
            width: 100%;
            height: 100%;
            align-items: stretch;
        }

        .drop-zone-text svg {
            width: 32px;
            height: 32px;
            color: var(--accent);
            margin-bottom: 4px;
        }

        .drop-zone-text span {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .drop-zone-text small {
            color: var(--text-muted);
            font-size: 0.75rem;
        }

        .confirm-title {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--accent);
        }

        .res-options {
            display: flex;
            gap: 10px;
            width: 100%;
            justify-content: center;
            margin-bottom: 12px;
        }

        .res-card {
            flex: 1;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 5px 16px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            max-width: 140px;
        }

        .res-card input {
            display: none;
        }

        .res-card:hover {
            border-color: var(--accent);
        }

        .res-card.selected {
            border-color: var(--accent);
            background: rgba(200, 210, 224, 0.1);
            box-shadow: 0 0 10px var(--glow);
        }

        .res-name {
            font-size: 0.75rem;
            font-weight: 600;
        }

        .res-val {
            font-size: 0.65rem;
            color: var(--text-muted);
        }

        .badge {
            position: absolute;
            top: 3px;
            right: 3px;
            background: transparent;
            color: var(--accent);
            font-size: 8px;
            padding: 1px 6px;
            border-radius: 4px;
            font-weight: 900;
            text-transform: uppercase;
            box-shadow: none;
            border: 1px solid var(--accent);
            z-index: 999;
            pointer-events: none;
        }

        .res-card {
            position: relative;
        }

        .start-btn {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 6px 16px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            white-space: nowrap;
        }

        .start-btn:hover {
            background: var(--accent-hover);
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            width: 100%;
            font-size: 0.75rem;
            margin-bottom: 4px;
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background: var(--border);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent), #ffffff, var(--accent));
            background-size: 200% 100%;
            border-radius: 4px;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            animation: shimmer 2s infinite linear;
            box-shadow: 0 0 10px var(--glow);
        }

        @keyframes shimmer {
            0% {
                background-position: 200% 0;
            }

            100% {
                background-position: -200% 0;
            }
        }

        .progress-details {
            font-size: 0.65rem;
            color: var(--text-muted);
            margin-top: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        .section-result {
            flex-direction: row !important;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 0 10px;
        }

        .section-result img {
            height: 70px;
            width: 70px;
            border-radius: 10px;
            background: #000;
            object-fit: contain;
            border: 1px solid var(--border);
            flex-shrink: 0;
        }

        .result-info {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            text-align: left;
            gap: 2px;
        }

        .success-msg {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.95rem;
            color: #10B981;
            font-weight: 600;
        }

        .restart-alert {
            display: flex;
            align-items: center;
            background: rgba(234, 179, 8, 0.1);
            border: 1px solid rgba(234, 179, 8, 0.3);
            border-radius: 4px;
            padding: 4px;
            gap: 6px;
            margin-top: 2px;
            margin-bottom: 4px;
        }

        .restart-msg {
            font-size: 0.75rem;
            color: #facc15;
            line-height: 1.2;
            max-width: 100%;
        }

        #file-input {
            display: none;
        }

        .error-msg {
            position: absolute;
            bottom: 4px;
            color: #ef4444;
            font-size: 0.7rem;
            display: none;
        }

        /* ONLINE MODE CSS */
        .online-search-bar {
            display: flex;
            gap: 6px;
            padding: 6px 8px;
            background: rgba(0,0,0,0.2);
            border-bottom: 1px solid var(--border);
            box-sizing: border-box;
        }

        .online-search-bar input[type="text"] {
            flex: 1;
            background: var(--bg-color);
            border: 1px solid var(--border);
            color: white;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 0.75rem;
            outline: none;
        }

        .online-search-bar input:focus {
            border-color: var(--accent);
        }

        .icon-grid {
            flex: 1;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(32px, 1fr));
            gap: 6px;
            padding: 8px;
            align-content: flex-start;
        }

        .icon-grid::-webkit-scrollbar {
            width: 6px;
        }
        .icon-grid::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        .icon-item {
            width: 32px;
            height: 32px;
            background: rgba(255,255,255,0.05);
            border: 1px solid transparent;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .icon-item:hover {
            border-color: var(--accent);
            background: rgba(200, 210, 224, 0.1);
        }

        .icon-item img {
            width: 24px;
            height: 24px;
            filter: drop-shadow(0 0 1px rgba(0,0,0,0.5));
        }

        .loading-spinner {
            color: var(--text-muted);
            font-size: 0.7rem;
            text-align: center;
            width: 100%;
            grid-column: 1 / -1;
            padding: 10px 0;
        }
    
        /* ── silver shimmer theme + accessibility helpers (injected) ── */
        :root { --accent-ink:#0f172a; --silver-1:#9aa6b6; --silver-2:#ffffff; }
        @keyframes silverShine { 0%{background-position:220% 0} 100%{background-position:-220% 0} }
        .start-btn, button.start-btn {
            background-image: linear-gradient(110deg, var(--silver-1) 0%, var(--silver-2) 45%, #cfd6e2 55%, var(--silver-1) 100%);
            background-size: 220% 100%;
            color: var(--accent-ink) !important;
            border: none;
            animation: none; /* shimmer only while working */
            box-shadow: 0 2px 10px rgba(207,214,226,0.18);
        }
        .start-btn.outline { background-image:none; background:transparent; color:var(--text-muted) !important; animation:none; box-shadow:none; }
        .start-btn.btn-dark{background:var(--border)!important;background-image:none!important;color:var(--text-main)!important;animation:none;box-shadow:none;}
        .start-btn.working, button.start-btn.working { animation: silverShine 3.5s linear infinite; }
        .start-btn:hover { filter: brightness(1.06); }
        .ui-hint {
            display:inline-flex; align-items:center; gap:5px;
            font-size:0.62rem; line-height:1.2; color:var(--text-muted);
            background:rgba(255,255,255,0.05); border:1px solid var(--border);
            border-radius:10px; padding:2px 8px; white-space:nowrap; user-select:none;
        }
        .ui-hint svg { width:11px; height:11px; opacity:.85; flex-shrink:0; }
        .ui-hint b { color:var(--text-main); font-weight:600; }

    
        /*range-fix*/
        input[type="range"]{-webkit-appearance:none;appearance:none;height:4px;background:var(--border);border-radius:3px;outline:none;}
        input[type="range"]::-webkit-slider-runnable-track{height:4px;background:var(--border);border-radius:3px;}
        input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:13px;height:13px;margin-top:-4.5px;border-radius:50%;background:var(--accent);box-shadow:0 0 6px var(--glow);border:none;cursor:pointer;}
        input[type="range"]::-webkit-slider-thumb:hover{background:#ffffff;}
        input[type="range"]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--accent);border:none;cursor:pointer;}
        input[type="range"]::-moz-range-track{height:4px;background:var(--border);border-radius:3px;}
    
        /*ai-thinking*/
        @keyframes aiThink { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
        @keyframes aiDots { 0%{content:''} 20%{content:'.'} 40%{content:'..'} 60%,100%{content:'...'} }
        .ai-thinking{
            display:inline-block; font-weight:600;
            background-image:linear-gradient(90deg,#8b95a7 0%,#ffffff 25%,#cfd6e2 50%,#ffffff 75%,#8b95a7 100%);
            background-size:200% 100%;
            -webkit-background-clip:text; background-clip:text;
            -webkit-text-fill-color:transparent; color:transparent;
            animation:aiThink 1.8s linear infinite;
        }
        .ai-thinking-dots::after{ content:''; display:inline-block; width:1.1em; text-align:left; animation:aiDots 1.4s steps(1,end) infinite; color:#cfd6e2; font-weight:600; }
    </style>
</head>

<body>
    <div class="uspi-wrapper">
    <div class="container">
        <div id="drop-zone" class="app-panel">

            <div id="section-drop" class="section section-drop visible">
                <div class="online-search-bar" style="align-items: center;">
                    <input type="text" id="icon-search-input" data-localize="search_placeholder" placeholder="Buscar ícones (ex: discord)..." onkeypress="if(event.key === 'Enter') searchIconify()">
                    <input type="color" id="icon-color-picker" data-localize="color_picker_title" value="#ffffff" style="width: 28px; height: 24px; padding: 0; border: 1px solid var(--border); border-radius: 4px; cursor: pointer; background: transparent; flex-shrink: 0;" title="Cor do Ícone">
                    <input type="color" id="bg-color-picker" data-localize="bg_color_picker_title" value="#000000" style="width: 28px; height: 24px; padding: 0; border: 1px solid var(--border); border-radius: 4px; cursor: pointer; background: transparent; flex-shrink: 0;" title="Cor do Fundo">
                    <button class="start-btn" style="padding: 4px 10px; font-size: 0.7rem;" data-localize="search_btn" onclick="searchIconify()">Buscar</button>
                </div>
                <div class="icon-grid" id="icon-grid">
                    <!-- icons loaded here -->
                </div>
                <div class="error-msg" id="online-error-msg" style="bottom: 2px; text-align: center; width: 100%;"></div>
            </div>

            <div id="section-confirm" class="section section-confirm" style="justify-content: center; padding: 0;">
                <div style="display: flex; flex-direction: row; align-items: center; justify-content: center; width: 100%; height: 100%; gap: 24px; padding: 0;">
                    
                    <!-- Left: Preview & Scale -->
                    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; width: 140px; flex-shrink: 0; padding-top: 6px;">
                        <div id="preview-container" style="width: 48px; height: 48px; background: rgba(0,0,0,0.3); border-radius: 8px; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; overflow: hidden; margin-bottom: 6px; cursor: pointer;">
                            <img id="selected-icon-preview" src="" style="width: 100%; height: 100%; object-fit: contain; display: block; transition: transform 0.1s;">
                        </div>
                        <div class="ui-hint" style="margin-bottom: 10px;" onclick="document.getElementById('preview-container').dispatchEvent(new MouseEvent('dblclick'))">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5"/></svg>
                            <span data-localize="hint_dblclick">Duplo clique para ajustar</span>
                        </div>
                        
                        <div style="width: 100%; box-sizing: border-box;">
                            <div style="display: flex; justify-content: space-between; font-size: 0.6rem; color: var(--text-main); margin-bottom: 6px; white-space: nowrap;">
                                <span data-localize="icon_scale_title">Tamanho</span>
                                <span id="scale-val">100%</span>
                            </div>
                            <input type="range" id="icon-scale-slider" min="0.1" max="4" step="0.05" value="1" style="width: 100%; height: 4px; accent-color: var(--accent); margin: 0;" oninput="globalScale = parseFloat(this.value); document.getElementById('scale-val').textContent = Math.round(this.value * 100) + '%'; if(typeof applyGlobalTransformToPreview === 'function') applyGlobalTransformToPreview();">
                        </div>
                    </div>

                    <!-- Right: Resolution & Buttons -->
                    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; padding-top: 6px; gap: 12px; width: 250px;">
                        <div class="res-options" style="margin: 0; width: 100%; display: flex; gap: 8px;">
                            <label class="res-card selected" id="card-std" onclick="updateGlobalRes('std')">
                                <input type="radio" name="res" value="std" checked>
                                <span class="res-name" data-localize="res_std">Padrão</span>
                                <span class="res-val">196x196</span>
                            </label>
                            <label class="res-card" id="card-clock" onclick="updateGlobalRes('clock')">
                                <input type="radio" name="res" value="clock">
                                <span class="badge" data-localize="badge_beta">BETA</span>
                                <span class="res-name" data-localize="res_clock">Relógio</span>
                                <span class="res-val">458x196</span>
                            </label>
                        </div>
                        
                        <div style="display: flex; gap: 8px; justify-content: center; width: 100%;">
                            <button id="btn-cancel" class="start-btn btn-dark" style="background: var(--border); color: var(--text-main); font-size: 0.75rem; padding: 6px 16px; flex: 1;" onclick="pendingFiles = []; showSection('drop')" data-localize="btn_change_icon">Alterar Ícone</button>
                            <button id="btn-start" class="start-btn" style="padding: 6px 16px; flex: 1;" data-localize="btn_process">Processar</button>
                        </div>
                    </div>
                </div>
            </div>

            <div id="section-progress" class="section section-progress">
                <div class="progress-label">
                    <span id="prog-status" data-localize="status_processing">Processando...</span>
                    <span id="prog-percent">0%</span>
                </div>
                <div class="progress-bar-bg">
                    <div id="prog-bar" class="progress-bar-fill"></div>
                </div>
                <div id="prog-details" class="progress-details" data-localize="status_starting">Iniciando...</div>
            </div>

            <div id="section-result" class="section section-result">
                <img id="res-img" src="" alt="Preview">
                <div class="result-info">
                    <span class="success-msg">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;">
                            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                            <polyline points="22 4 12 14.01 9 11.01"></polyline>
                        </svg>
                        <span data-localize="status_finished">Aplicado no botão!</span>
                    </span>
                    <div class="restart-alert">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#facc15" stroke-width="2" style="flex-shrink: 0;">
                            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                            <line x1="12" y1="9" x2="12" y2="13"></line>
                            <line x1="12" y1="17" x2="12.01" y2="17"></line>
                        </svg>
                        <span class="restart-msg" data-localize="msg_restart">Reinicie o Ulanzi Studio para atualizar a galeria</span>
                    </div>
                    <button id="btn-reset" class="start-btn" style="padding: 4px 12px; font-size: 0.75rem;"
                        data-localize="btn_new">Novo Ícone</button>
                </div>
            </div>

            <input type="file" id="file-input" accept="image/png, image/jpeg, image/gif" multiple>
        </div>
        <div id="error-msg" class="error-msg"></div>
    </div>
    </div>

    <script src="../ws-port.js"></script>
    <script>
        // ============================================
        // Sistema de Localização (i18n)
        // ============================================
        const AVAILABLE_LANGS = ['en', 'pt', 'es', 'fr', 'de', 'zh', 'ja', 'ko', 'zh_TW'];
        let currentLocale = {};
        let currentLangCode = 'en';

        /**
         * Detecta o idioma correto a partir do código do SDK ou navegador.
         */
        function resolveLanguageCode(rawLang) {
            if (!rawLang) return 'en';
            
            // Tratamento especial para Chinês Tradicional (Taiwan / Hong Kong)
            const lowerLang = rawLang.toLowerCase();
            if (lowerLang === 'zh-tw' || lowerLang === 'zh_tw' || lowerLang === 'zh-hk' || lowerLang === 'zh_hk') {
                return 'zh_TW';
            }

            const normalized = lowerLang.replace(/[-_].*$/, '');
            if (AVAILABLE_LANGS.includes(normalized)) return normalized;
            return 'en';
        }

        /**
         * Obtém o código de idioma do SDK (query param) ou do navegador.
         */
        function detectLanguage() {
            const params = new URLSearchParams(window.location.search);
            const sdkLang = params.get('language');
            if (sdkLang) return resolveLanguageCode(sdkLang);

            const browserLang = navigator.languages && navigator.languages.length
                ? navigator.languages[0]
                : (navigator.language || navigator.userLanguage);
            return resolveLanguageCode(browserLang);
        }

        /**
         * Carrega o JSON de tradução e aplica nos elementos data-localize.
         */
        async function loadAndApplyLocalization() {
            currentLangCode = detectLanguage();
            const ts = Date.now();
            try {
                const resp = await fetch(`../${currentLangCode}.json?t=${ts}`);
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                const json = await resp.json();
                currentLocale = json.Localization || {};
            } catch (e) {
                console.warn(`[i18n] Falha ao carregar ${currentLangCode}.json, usando fallback 'en'`);
                try {
                    const resp = await fetch(`../en.json?t=${ts}`);
                    if (resp.ok) {
                        const json = await resp.json();
                        currentLocale = json.Localization || {};
                    }
                } catch (e2) {
                    console.error('[i18n] Falha total no carregamento de idiomas');
                    currentLocale = {};
                }
            }
            applyLocalization();
        }

        /**
         * Aplica as traduções em todos os elementos com data-localize.
         */
        function applyLocalization() {
            document.querySelectorAll('[data-localize]').forEach(el => {
                const key = el.dataset.localize;
                if (!key || !currentLocale[key]) return;

                if (el.hasAttribute('title')) {
                    el.title = currentLocale[key];
                    el.setAttribute('aria-label', currentLocale[key]);
                } else if (el.hasAttribute('placeholder')) {
                    el.placeholder = currentLocale[key];
                } else if (el.tagName === 'INPUT') {
                    // skip
                } else {
                    el.textContent = currentLocale[key];
                }
            });
        }

        /**
         * Função de tradução: retorna o texto localizado para uma chave.
         */
        function t(key) {
            return (currentLocale && currentLocale[key]) || key;
        }

        // ============================================
        // Lógica principal do plugin
        // ============================================
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const countLabel = document.getElementById('count-label');
        const btnStart = document.getElementById('btn-start');
        const resCards = document.querySelectorAll('.res-card');
        const resImg = document.getElementById('res-img');
        const btnReset = document.getElementById('btn-reset');

        let selectedRes = 'std';
        const sections = {
            drop: document.getElementById('section-drop'),
            confirm: document.getElementById('section-confirm'),
            progress: document.getElementById('section-progress'),
            result: document.getElementById('section-result')
        };

        let pendingFiles = [];
        let actionContext = null;
        const MAX_SIZE_BYTES = 295 * 1024;

        // Carrega a localização ANTES de conectar ao SDK
        loadAndApplyLocalization().then(() => {

        // Recolor every visible search result live. Pass the RAW hex ("#ff0000") to
        // searchParams.set — it URL-encodes '#' → '%23' itself. (The old code passed a
        // pre-encoded "%23ff0000", which got double-encoded to "%2523ff0000" → iconify
        // fell back to black.) Uses 'input' (like the background picker) so it updates
        // in real time; debounced so dragging through the color wheel doesn't flood the
        // Iconify API. No need to press "Search" again.
        function applyIconColorLive() {
            const raw = document.getElementById('icon-color-picker').value; // e.g. "#ff0000"
            document.querySelectorAll('.icon-item img').forEach(img => {
                try { const url = new URL(img.src); url.searchParams.set('color', raw); img.src = url.toString(); } catch (e) {}
            });
            const previewImg = document.getElementById('selected-icon-preview');
            if (previewImg && previewImg.src.includes('api.iconify.design')) {
                try { const url = new URL(previewImg.src); url.searchParams.set('color', raw); previewImg.src = url.toString(); } catch (e) {}
            }
        }
        let _iconColorT = null;
        document.getElementById('icon-color-picker').addEventListener('input', () => {
            if (_iconColorT) clearTimeout(_iconColorT);
            _iconColorT = setTimeout(applyIconColorLive, 120);
        });
        document.getElementById('icon-color-picker').addEventListener('change', applyIconColorLive);

        document.getElementById('bg-color-picker').addEventListener('input', (e) => {
            const color = e.target.value === '#000000' ? '' : e.target.value;
            // Atualiza grid items
            document.querySelectorAll('.icon-item').forEach(el => {
                el.style.backgroundColor = color;
            });
            // Atualiza preview
            const previewContainer = document.getElementById('preview-container');
            if (previewContainer) {
                previewContainer.style.backgroundColor = color || 'rgba(0,0,0,0.3)';
            }
        });

        // One gtx call for a given source language. Returns English output plus
        // the detected source language + confidence (meaningful only when sl='auto').
        async function gtxTranslate(text, sl) {
            const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=en&dt=t&q=${encodeURIComponent(text)}`;
            const r = await fetch(url);
            const j = await r.json();
            return {
                out: (j[0] || []).map(s => s[0]).join('').trim(),
                det: j[2],
                conf: j[6]
            };
        }

        // Translate ANY language → English (Iconify only indexes English keywords),
        // independent of the Ulanzi UI language. gtx auto-detect is unreliable on
        // short single words (e.g. "bola" → Slovak), so: (1) trust auto only when
        // confident; (2) otherwise probe a priority list of languages and take the
        // first real translation; (3) keep genuine English as-is.
        
        // Non-Google fallback — translate.googleapis.com is blocked in some regions
        // (e.g. mainland China). MyMemory is reachable there and needs no API key.
        async function myMemoryToEn(text, sl) {
            const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${encodeURIComponent(sl)}|en`;
            const r = await fetch(url);
            const j = await r.json();
            const out = ((j.responseData && j.responseData.translatedText) || '').trim();
            // accept only when it actually produced non-CJK/Hangul output
            return out && !/[\u3000-\u9fff\uac00-\ud7af]/.test(out) ? out : '';
        }
        // guess the source language from the script when online detection is unavailable
        function guessSourceLang(text) {
            if (/[\u4e00-\u9fff]/.test(text)) return 'zh-CN';
            if (/[\u3040-\u30ff]/.test(text)) return 'ja';
            if (/[\uac00-\ud7af]/.test(text)) return 'ko';
            if (/[\u0400-\u04ff]/.test(text)) return 'ru';
            return null;
        }
        async function fallbackTranslate(text) {
            try {
                const lc = text.toLowerCase();
                const ui = (typeof currentLangCode !== 'undefined' && currentLangCode)
                    ? (({ zh: 'zh-CN', zh_TW: 'zh-TW' })[currentLangCode] || currentLangCode) : null;
                const order = [];
                const push = l => { if (l && l !== 'en' && !order.includes(l)) order.push(l); };
                push(guessSourceLang(text)); push(ui);
                ['zh-CN', 'pt', 'es', 'fr', 'de'].forEach(push);
                for (const sl of order.slice(0, 4)) {
                    const out = await myMemoryToEn(text, sl);
                    if (out && out.toLowerCase() !== lc) return out;
                }
            } catch (e) { /* offline → keep original */ }
            return text;
        }

        async function translateToEn(text) {
            try {
                const lc = text.toLowerCase();
                const a = await gtxTranslate(text, 'auto');
                if (a.det === 'en' && a.conf >= 0.8) return text;
                if (a.det && a.det !== 'en' && a.conf >= 0.7 && a.out && a.out.toLowerCase() !== lc) {
                    return a.out;
                }
                const uiSl = ({ zh: 'zh-CN', zh_TW: 'zh-TW' })[currentLangCode] || currentLangCode;
                const order = [];
                const push = l => { if (l && l !== 'en' && !order.includes(l)) order.push(l); };
                push(uiSl);
                ['pt', 'es', 'fr', 'de', 'it', 'ru', 'ja', 'ko', 'zh-CN'].forEach(push);
                for (const sl of order) {
                    const r = await gtxTranslate(text, sl);
                    if (r.out && r.out.toLowerCase() !== lc) return r.out;
                }
                return a.out || text;
            } catch (e) { return await fallbackTranslate(text); }
        }

        async function searchIconify() {
            const query = document.getElementById('icon-search-input').value.trim();
            const grid = document.getElementById('icon-grid');
            const errorMsg = document.getElementById('online-error-msg');

            errorMsg.style.display = 'none';
            if (!query) return;

            grid.innerHTML = `<div class="loading-spinner"><span class="ai-thinking">${t('search_loading')}</span><span class="ai-thinking-dots"></span></div>`;

            // Always translate to English (any language) — Iconify only indexes
            // English keywords. English in → English out.
            let searchTerm = (await translateToEn(query)).toLowerCase() || query;

            try {
                const response = await fetch(`https://api.iconify.design/search?query=${encodeURIComponent(searchTerm)}&limit=36`);
                if (!response.ok) throw new Error('API Error');
                const data = await response.json();
                
                grid.innerHTML = '';
                
                if (!data.icons || data.icons.length === 0) {
                    grid.innerHTML = `<div style="grid-column: 1 / -1; padding-top: 25px; text-align: center; color: #ef4444; font-size: 0.8rem;">${t('search_empty')}</div>`;
                    return;
                }

                data.icons.forEach(iconName => {
                    const [prefix, name] = iconName.split(':');
                    const colorHex = document.getElementById('icon-color-picker').value.replace('#', '%23');
                    const svgUrl = `https://api.iconify.design/${prefix}/${name}.svg?color=${colorHex}`;
                    
                    const el = document.createElement('div');
                    el.className = 'icon-item';
                    
                    const bgColorPicker = document.getElementById('bg-color-picker');
                    if (bgColorPicker && bgColorPicker.value !== '#000000') {
                        el.style.backgroundColor = bgColorPicker.value;
                    }
                    
                    const img = document.createElement('img');
                    img.src = svgUrl;
                    img.crossOrigin = 'anonymous'; // Important for CORS and fetching
                    
                    el.appendChild(img);
                    el.onclick = () => fetchIconAndSelect(svgUrl, `${name}.svg`);
                    
                    grid.appendChild(el);
                });
            } catch (err) {
                console.error('Search error:', err);
                grid.innerHTML = `<div style="grid-column: 1 / -1; padding-top: 25px; text-align: center; color: #ef4444; font-size: 0.8rem;">${t('search_error')}</div>`;
            }
        }

        async function fetchIconAndSelect(url, filename) {
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('HTTP ' + response.status);
                
                // Extrai o texto do SVG direto para evitar falhas no blob() em CEFs antigos
                let svgText = await response.text();
                // Força dimensões fixas no SVG para que o Image/Canvas não renderize ele minúsculo (1em)
                svgText = svgText.replace(/width="[^"]+"/, 'width="196"').replace(/height="[^"]+"/, 'height="196"');
                
                const blob = new Blob([svgText], { type: "image/svg+xml" });
                
                let file;
                try {
                    file = new File([blob], filename, { type: "image/svg+xml" });
                } catch(e) {
                    file = blob;
                    file.name = filename;
                    file.type = "image/svg+xml";
                }
                
                pendingFiles = [file];
                
                const previewImg = document.getElementById('selected-icon-preview');
                previewImg.src = URL.createObjectURL(blob);
                const bgColorPicker = document.getElementById('bg-color-picker');
                const previewContainer = document.getElementById('preview-container');
                if (previewContainer) {
                    if (bgColorPicker && bgColorPicker.value !== '#000000') {
                        previewContainer.style.backgroundColor = bgColorPicker.value;
                    } else {
                        previewContainer.style.backgroundColor = 'rgba(0,0,0,0.3)';
                    }
                }
                
                showSection('confirm');
            } catch (err) {
                console.error('Fetch icon error:', err);
                const errorMsg = document.getElementById('online-error-msg');
                errorMsg.textContent = t('error_download') + err.message;
                errorMsg.style.display = 'block';
                alert(t('error_download') + err.message);
            }
        }

        function handleFiles(files) {
            pendingFiles = Array.from(files).filter(f => f.type.match('image.*'));
            if (!pendingFiles.length) {
                alert(t('alert_invalid_files'));
                return;
            }
            countLabel.textContent = pendingFiles.length;
            showSection('confirm');

        btnReset.addEventListener('click', () => {
            pendingFiles = [];
            fileInput.value = '';
            showSection('drop');
        });

        btnStart.addEventListener('click', async (e) => {
            e.stopPropagation();
            const tw = selectedRes === 'clock' ? 458 : 196;
            const th = 196;
            const folder = selectedRes === 'clock' ? 'IconResizerClock' : 'IconResizer';

        function updateProgressBar(percent, status = null, details = null) {
            const bar = document.getElementById('prog-bar');
            const label = document.getElementById('prog-percent');
            const statusEl = document.getElementById('prog-status');
            const detailsEl = document.getElementById('prog-details');

            if (percent !== null) {
                const p = Math.min(100, Math.max(0, percent));
                bar.style.width = p + '%';
                label.textContent = Math.round(p) + '%';
            }
            if (status) statusEl.textContent = status;
            if (details) {
                detailsEl.textContent = details;
                detailsEl.title = details;
            }
        }

        async function processBatch(files, tw, th, folder) {
            let hasError = false;
            for (let i = 0; i < files.length; i++) {
                try {
                    const resName = (tw === 458) ? `${t('res_clock')} (458x196)` : `${t('res_std')} (196x196)`;
                    const statusStr = `${t('batch_label')}: ${i + 1}/${files.length}`;
                    const detailsStr = `${resName} - ${files[i].name}`;

                    const basePercent = (i / files.length) * 100;
                    updateProgressBar(basePercent, statusStr, detailsStr);

                    const isLastFile = (i === files.length - 1);
                    await processSingleFile(files[i], tw, th, folder, i, isLastFile, (subPercent) => {
                        const totalPercent = basePercent + (subPercent / files.length);
                        updateProgressBar(totalPercent);
                    });

                    if (!isLastFile) {
                        // Evita inundar e travar a renderização visual local
                        await new Promise(r => setTimeout(r, 400));
                    }
                } catch (err) {
                    console.error("Erro no lote: ", err);
                    alert(`${t('error_processing_file')} "${files[i].name}": ${err.message}`);
                    hasError = true;
                    showSection('confirm');
                    break;
                }
            }
            if (!hasError) {
                updateProgressBar(100, `✅ ${t('status_done')}`);
                setTimeout(() => showSection('result'), 500);
            }
        }

        async function processSingleFile(file, tw, th, folder, index, isLastFile, onProgress) {
            const name = file.name.replace(/\.[^/.]+$/, "");

            if (file.type === 'image/gif') {
                await processGif(file, tw, th, folder, name, index, isLastFile, onProgress);
            } else {
                await processStaticImage(file, tw, th, folder, name, index, isLastFile, onProgress);
            }
        }

        async function processStaticImage(file, tw, th, folder, name, index, isLastFile, onProgress) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = async () => {
                        try {
                            const cvs = document.createElement('canvas');
                            cvs.width = tw;
                            cvs.height = th;
                            const ctx = cvs.getContext('2d');

                            const bgColorPicker = document.getElementById('bg-color-picker');
                            ctx.fillStyle = bgColorPicker && bgColorPicker.value !== '#000000' ? bgColorPicker.value : '#000000';
                            ctx.fillRect(0, 0, tw, th);

                            const cropperFrame = document.getElementById('cropper-frame');
                            const cropperHeight = parseFloat(cropperFrame ? cropperFrame.dataset.cheight : 196) || 196;
                            const canvasRatio = th / cropperHeight;
                            
                            const canvasPanX = (typeof globalPanX !== 'undefined' ? globalPanX : 0) * canvasRatio;
                            const canvasPanY = (typeof globalPanY !== 'undefined' ? globalPanY : 0) * canvasRatio;

                            const fitRatio = Math.min(tw / img.width, th / img.height);
                            const userScaleLocal = typeof globalScale !== 'undefined' ? globalScale : 1;
                            
                            const finalWidth = img.width * fitRatio * userScaleLocal;
                            const finalHeight = img.height * fitRatio * userScaleLocal;
                            
                            const dx = (tw - finalWidth) / 2 + canvasPanX;
                            const dy = (th - finalHeight) / 2 + canvasPanY;

                            ctx.drawImage(img, 0, 0, img.width, img.height, dx, dy, finalWidth, finalHeight);

                            if (onProgress) onProgress(50);

                            cvs.toBlob(async (blob) => {
                                try {
                                    let finalBlob = blob;
                                    if (finalBlob.size > MAX_SIZE_BYTES) {
                                        let quality = 0.9;
                                        while (finalBlob.size > MAX_SIZE_BYTES && quality > 0.3) {
                                            finalBlob = await new Promise(r => cvs.toBlob(r, 'image/jpeg', quality));
                                            quality -= 0.1;
                                        }
                                    }

                                    const resultB64 = await blobToBase64(finalBlob);
                                    const pureB64 = resultB64.split(',')[1];

                                    if (isLastFile && typeof $UD !== 'undefined' && actionContext) {
                                        showSuccessOnDeck();
                                        await new Promise(r => setTimeout(r, 400));
                                    }

                                    const uniqueId = index + "_" + Date.now().toString().slice(-5);
                                    await saveToLibrary(finalBlob, `${name}_${uniqueId}_ulanzi.png`, folder);

                                    resImg.src = resultB64;
                                    resImg.style.width = selectedRes === 'clock' ? '163px' : '70px';
                                    if (onProgress) onProgress(100);
                                    resolve();
                                } catch (err) {
                                    reject(err);
                                }
                            }, 'image/png');
                        } catch (err) {
                            reject(err);
                        }
                    };
                    img.onerror = () => reject(new Error(t('error_canvas_decode')));
                    img.src = e.target.result;
                };
                reader.onerror = () => reject(new Error(t('error_file_read')));
                reader.readAsDataURL(file);
            });
        }

        async function processGif(file, tw, th, folder, name, index, isLastFile, onProgress) {
            const GifsicleWasm = window.gifsicle || (typeof gifsicle !== 'undefined' ? gifsicle : null);
            if (!GifsicleWasm) throw new Error(t('error_wasm_not_loaded'));

            const buffer = await file.arrayBuffer();

            const imgInfo = await new Promise((resolve, reject) => {
                const i = new Image();
                const objUrl = URL.createObjectURL(file);
                i.onload = () => { URL.revokeObjectURL(objUrl); resolve({ w: i.width, h: i.height }); };
                i.onerror = () => { URL.revokeObjectURL(objUrl); reject(new Error(t('error_gif_dimensions'))); };
                i.src = objUrl;
            });

            const targetRatio = tw / th;
            const imgRatio = imgInfo.w / imgInfo.h;
            let cropW = imgInfo.w;
            let cropH = imgInfo.h;

            if (imgRatio > targetRatio) {
                cropW = Math.round(imgInfo.h * targetRatio);
            } else {
                cropH = Math.round(imgInfo.w / targetRatio);
            }

            const cropX = Math.floor((imgInfo.w - cropW) / 2);
            const cropY = Math.floor((imgInfo.h - cropH) / 2);

            // IMPORTANT: no --logical-screen here. --resize already sets the logical
            // screen to ${tw}x${th}; pairing --logical-screen with a --crop made gifsicle
            // keep the crop's width — a 270-wide portrait source became a 270-wide frame
            // on a 458 canvas (content stuck to the left, right half empty) in clock
            // format. Dropping --logical-screen makes the frame fill the full canvas.
            const upscaling = cropW < tw || cropH < th; // small source → sharpen the upscale
            const cmdTransform = [`1.gif --crop ${cropX},${cropY}+${cropW}x${cropH} ${upscaling ? '--resize-method lanczos3 ' : ''}--resize ${tw}x${th} --loopcount=forever --no-comments --no-names --no-extensions --no-warnings -o /out/out.gif`];

            if (onProgress) onProgress(20);
            let outFiles = await GifsicleWasm.run({
                input: [{ file: buffer, name: '1.gif' }],
                command: cmdTransform
            });

            if (!outFiles || !outFiles.length) throw new Error(t('error_wasm_transform'));

            const baseBlob = new Blob([outFiles[0].file || outFiles[0]], { type: 'image/gif' });
            let finalBlob = baseBlob;

            // Compression ladder (best → worst quality). Each rung runs on the SAME base
            // GIF (non-cumulative, so lossy artifacts don't compound) and we keep the
            // FIRST that fits the 295 KB budget — so the key/clock GIF keeps as many
            // colors as possible instead of being crushed to a handful. --lossy saves far
            // more per unit of quality than dropping colors alone (clock example: 48
            // colors @ ~279 KB with lossy, vs only 8 colors the old color-only way).
            if (baseBlob.size > MAX_SIZE_BYTES) {
                const ladder = [
                    { colors: 0, lossy: 30 }, { colors: 0, lossy: 60 },
                    { colors: 128, lossy: 40 }, { colors: 96, lossy: 60 },
                    { colors: 64, lossy: 70 }, { colors: 48, lossy: 90 },
                    { colors: 32, lossy: 100 }, { colors: 24, lossy: 120 },
                    { colors: 16, lossy: 120 }, { colors: 8, lossy: 80 },
                    { colors: 4, lossy: 40 }, { colors: 2, lossy: 0 }
                ];
                const baseBuf = await baseBlob.arrayBuffer();
                for (let i = 0; i < ladder.length; i++) {
                    const step = ladder[i];
                    if (onProgress) onProgress(30 + Math.round((i / ladder.length) * 60));
                    const flags = ['1.gif'];
                    if (step.colors) flags.push(`--colors ${step.colors}`);
                    if (step.lossy) flags.push(`--lossy=${step.lossy}`);
                    flags.push('-O3 --careful --no-warnings -o /out/out.gif');
                    const r = await GifsicleWasm.run({
                        input: [{ file: baseBuf.slice(0), name: '1.gif' }],
                        command: [flags.join(' ')]
                    });
                    if (r && r.length) {
                        finalBlob = new Blob([r[0].file || r[0]], { type: 'image/gif' });
                        if (finalBlob.size <= MAX_SIZE_BYTES) break;
                    }
                }
            }

            const finalInfo = await new Promise((resolve, reject) => {
                const i = new Image();
                const objUrl = URL.createObjectURL(finalBlob);
                i.onload = () => { URL.revokeObjectURL(objUrl); resolve({ w: i.width, h: i.height }); };
                i.onerror = () => { URL.revokeObjectURL(objUrl); reject(new Error(t('error_gif_validate'))); };
                i.src = objUrl;
            });

            const isCorrectSize = finalInfo.w === tw && finalInfo.h === th;
            const isUnderLimit = finalBlob.size <= MAX_SIZE_BYTES;

            if (!isCorrectSize || !isUnderLimit) {
                const sizeKB = (finalBlob.size / 1024).toFixed(0);
                throw new Error(t('error_gif_too_large').replace('{size}', sizeKB));
            }

            const finalB64 = await blobToBase64(finalBlob);
            const pureB64 = finalB64.split(',')[1];

            if (isLastFile && typeof $UD !== 'undefined' && actionContext) {
                showSuccessOnDeck();
                await new Promise(r => setTimeout(r, 400));
            }

            const uniqueId = index + "_" + Date.now().toString().slice(-5);
            await saveToLibrary(finalBlob, `${name}_${uniqueId}_ulanzi.gif`, folder);

            resImg.src = finalB64;
            resImg.style.width = selectedRes === 'clock' ? '163px' : '70px';
            if (onProgress) onProgress(100);
        }

        // Função corrigida: Retorna à integração original com servidor HTTP Node.js 
        async function saveToLibrary(blob, filename, folder) {
            const b64 = (await blobToBase64(blob)).split(',')[1];
            const payload = { action: 'saveIcon', base64: b64, filename, folder };
            const port = window.__port || 19871;

            return new Promise((resolve) => {
                const xhr = new XMLHttpRequest();
                xhr.open('POST', `http://127.0.0.1:${port}/save`, true);
                xhr.timeout = 3000;
                xhr.setRequestHeader('Content-Type', 'application/json');

                // Aguarda o FileSystem do Node.js gravar o arquivo fisicamente antes de prosseguir
                xhr.onload = () => {
                    setTimeout(resolve, 800);
                };

                // Em caso de falha HTTP, recorremos ao WebSocket apenas como contingência
                xhr.onerror = () => {
                    if (typeof $UD !== 'undefined' && $UD.sendToPlugin) {
                        $UD.sendToPlugin(payload);
                    }
                    setTimeout(resolve, 800);
                };

                xhr.ontimeout = () => {
                    if (typeof $UD !== 'undefined' && $UD.sendToPlugin) {
                        $UD.sendToPlugin(payload);
                    }
                    setTimeout(resolve, 800);
                };

                xhr.send(JSON.stringify(payload));
            });
        }

        function blobToBase64(blob) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result);
                reader.readAsDataURL(blob);
            });
        }

        /**
         * Exibe um ícone de "check" verde no deck físico por 3 segundos,
         * e depois restaura a logo original do plugin.
         */
        function showSuccessOnDeck() {
            if (typeof $UD === 'undefined' || !actionContext) return;
            
            // Ícone de sucesso (Check verde SVG, 196x196) em Base64 puro
            const checkB64 = "data:image/svg+xml;base64," + btoa('<svg xmlns="http://www.w3.org/2000/svg" width="196" height="196" viewBox="0 0 196 196"><rect width="196" height="196" fill="#1E293B"/><circle cx="98" cy="98" r="60" fill="#10B981"/><path d="M70 100l20 20 40-40" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></svg>');
            
            try {
                // Atualiza o botão no Deck
                $UD.setBaseDataIcon(actionContext, checkB64);
                
                // Restaura a logo padrão do plugin após 3s
                setTimeout(() => {
                    if (typeof $UD !== 'undefined' && actionContext) {
                        // Utiliza o path relativo à raiz do plugin, igual no manifest
                        $UD.setPathIcon(actionContext, "resources/action-search.png");
                    }
                }, 3000);
            } catch (e) {
                console.warn("Falha ao atualizar ícone de sucesso no deck", e);
            }
        }

        <div style="color: var(--text-main); font-size: 0.7rem; margin-bottom: 3px; font-weight: 500;" data-localize="cropper_title">Ajustar Enquadramento</div>
        <div class="ui-hint" style="margin-bottom:4px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 9l-3 3 3 3M9 5l3-3 3 3M15 19l-3 3-3-3M19 9l3 3-3 3M2 12h20M12 2v20"/></svg><span data-localize="hint_cropper">Arraste para mover • use o slider para zoom</span></div>
        <div id="cropper-frame" style="border: 2px dashed var(--accent); position: relative; overflow: hidden; background: rgba(0,0,0,0.3); border-radius: 8px; cursor: grab; flex-shrink: 0;">
            <img id="cropper-img" src="" style="width: 100%; height: 100%; object-fit: contain; pointer-events: none; transform-origin: center;">
        </div>
    </div>
    
    <!-- Right: Controls -->
    <div style="display: flex; flex-direction: column; width: 100px; gap: 12px; flex-shrink: 0;">
        <div style="display: flex; flex-direction: column; gap: 4px;">
            <div style="display: flex; justify-content: space-between; font-size: 0.65rem; color: var(--text-main);">
                <span data-localize="icon_scale_title">Tamanho</span>
                <span id="cropper-scale-val">100%</span>
            </div>
            <input type="range" id="cropper-scale-slider" min="0.1" max="4" step="0.05" value="1" style="width: 100%; accent-color: var(--accent); margin: 0;">
        </div>
        
        <div style="display: flex; flex-direction: column; gap: 6px;">
            <button class="start-btn" style="padding: 6px; font-size: 0.7rem;" onclick="closeCropper(true)" data-localize="btn_confirm">Confirmar</button>
            <button class="start-btn btn-dark" style="background: var(--border); color: var(--text-main); font-size: 0.7rem; padding: 6px;" onclick="closeCropper(false)" data-localize="btn_cancel">Cancelar</button>
        </div>
    </div>
</div>
<script>
let globalPanX = 0;
let globalPanY = 0;
let globalScale = 1;

let tempPanX = 0;
let tempPanY = 0;
let tempScale = 1;

let isDragging = false;
let startX, startY;
let initialPanX, initialPanY;

function initCropper() {
    const previewContainer = document.getElementById('preview-container');
    if(previewContainer) {
        previewContainer.addEventListener('dblclick', () => {
            const previewImg = document.getElementById('selected-icon-preview');
            if(!previewImg || !previewImg.src || previewImg.src.endsWith('.html')) return;
            openCropper(previewImg.src);
        });
        previewContainer.style.cursor = 'pointer';
        previewContainer.title = (typeof $UD !== 'undefined' && $UD.localization && $UD.localization['tooltip_double_click']) ? $UD.localization['tooltip_double_click'] : 'Duplo clique para ajustar';
    }
    
    const frame = document.getElementById('cropper-frame');
    const slider = document.getElementById('cropper-scale-slider');
    if(!frame) return;

    frame.addEventListener('mousedown', (e) => {
        isDragging = true;
        startX = e.clientX;
        startY = e.clientY;
        initialPanX = tempPanX;
        initialPanY = tempPanY;
        frame.style.cursor = 'grabbing';
    });

    window.addEventListener('mousemove', (e) => {
        if(!isDragging) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        tempPanX = initialPanX + dx;
        tempPanY = initialPanY + dy;
        updateCropperImage();
    });

    window.addEventListener('mouseup', () => {
        if(isDragging) {
            isDragging = false;
            frame.style.cursor = 'grab';
        }
    });
    
    window.addEventListener('mouseleave', () => {
        if(isDragging) {
            isDragging = false;
            frame.style.cursor = 'grab';
        }
    });

    slider.addEventListener('input', (e) => {
        tempScale = parseFloat(e.target.value);
        document.getElementById('cropper-scale-val').textContent = Math.round(tempScale * 100) + '%';
        updateCropperImage();
    });
}

function openCropper(imgSrc) {
    const modal = document.getElementById('cropper-modal');
    const frame = document.getElementById('cropper-frame');
    const img = document.getElementById('cropper-img');
    const slider = document.getElementById('cropper-scale-slider');
    
    img.src = imgSrc;
    
    const bgColorPicker = document.getElementById('bg-color-picker');
    if (bgColorPicker && bgColorPicker.value !== '#000000') {
        frame.style.backgroundColor = bgColorPicker.value;
    } else {
        frame.style.backgroundColor = 'rgba(0,0,0,0.3)';
    }

    if (selectedRes === 'clock') {
            frame.style.width = '150px';
            frame.style.height = '64px';
            frame.dataset.cheight = "64";
        } else {
            frame.style.width = '96px';
            frame.style.height = '96px';
            frame.dataset.cheight = "96";
        }
    
    tempPanX = globalPanX;
    tempPanY = globalPanY;
    tempScale = globalScale;
    
    slider.value = tempScale;
    document.getElementById('cropper-scale-val').textContent = Math.round(tempScale * 100) + '%';
    updateCropperImage();
    
    modal.style.display = 'flex';
}

function updateCropperImage() {
    const img = document.getElementById('cropper-img');
    img.style.transform = `translate(${tempPanX}px, ${tempPanY}px) scale(${tempScale})`;
}

function closeCropper(save) {
    document.getElementById('cropper-modal').style.display = 'none';
    if(save) {
        globalPanX = tempPanX;
        globalPanY = tempPanY;
        globalScale = tempScale;
        
        const mainSlider = document.getElementById('icon-scale-slider');
        if(mainSlider) {
            mainSlider.value = globalScale;
            const scaleVal = document.getElementById('scale-val');
            if(scaleVal) scaleVal.textContent = Math.round(globalScale * 100) + '%';
        }
        
        applyGlobalTransformToPreview();
    }
}

function applyGlobalTransformToPreview() {
    const previewImg = document.getElementById('selected-icon-preview');
    if(!previewImg) return;
    
    const cropperHeight = parseFloat(document.getElementById('cropper-frame').dataset.cheight || 196);
    const ratio = 48 / cropperHeight;
    
    const previewPanX = globalPanX * ratio;
    const previewPanY = globalPanY * ratio;
    
    previewImg.style.transform = `translate(${previewPanX}px, ${previewPanY}px) scale(${globalScale})`;
}

setTimeout(initCropper, 500);
</script>
